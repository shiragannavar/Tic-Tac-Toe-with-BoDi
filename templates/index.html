<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe with BoDi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='confetti.css') }}">
</head>
<body>
    <div class="topbar">
        <!-- <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo"> -->
         <h2>Vibe Code with DataStax</h2>
    </div>
    <div class="container">
        <h1>Tic Tac Toe with BoDi</h1>
        <div class="status" id="status">Your turn (O)</div>
        <div class="board" id="board">
            {% for i in range(9) %}
            <div class="cell" data-position="{{ i }}">
                <span class="cell-content"></span>
                <img src="{{ url_for('static', filename='bodi.png') }}" class="bodi-img" style="display: none;">
            </div>
            {% endfor %}
        </div>
        <button id="reset">Reset Game</button>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
